<div class="create-post">
  <div class="create-post__container flex-column">
    <div class="flex-row">
      <i class="fa-solid fa-pen icon--blue icon--sm"></i>
      <h4 class="create-post__title text--light-gray">Create post</h4>
    </div>
    <form class="form" [formGroup]="createPostForm" (ngSubmit)="onSubmit()">
      <div class="form__group">
        <input
          type="text"
          class="form__input"
          formControlName="title"
          placeholder="Post title..."
        />
      </div>
      <textarea
        class="form__textarea create-post__textarea"
        placeholder="What's on your mind?"
        formControlName="content"
      ></textarea>
      <div class="flex-row justify-between items-center">
        <input type="file" (change)="onFileChange($event)" multiple />
        <input type="file" (change)="onPDFFileChange($event)" />

        <app-button
          size="sm"
          color="blue"
          text="Create post"
          class=""
        ></app-button>
      </div>
    </form>
  </div>
</div>
